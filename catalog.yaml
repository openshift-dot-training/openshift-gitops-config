# =============================================================================
#  Component catalog and repositories - values for the platform-catalog hub
#  chart (openshift-gitops-charts/charts/platform-catalog). WHAT can be
#  installed; groups.yaml decides WHERE; components/, group-values/ and
#  clusters/ hold the values and exact versions.
#  Every field: see that chart's values.yaml.
# =============================================================================

repos:
  charts:
    url: https://git.example.com/CHANGE-ME/openshift-gitops-charts.git
    # charts tag for every cluster; a cluster can test another one with the
    # ManagedCluster label chartsRevision=<tag>. Keep bootstrap/root-application.yaml
    # on the same tag (scripts/validate.sh checks it).
    version: v0.1.0
  config:
    url: https://git.example.com/CHANGE-ME/openshift-gitops-config.git
    revision: main

acm:
  clusterSets:
    - global

components:
  # ---------------- common ----------------
  logging:
    namespace: openshift-logging
    operator:
      name: cluster-logging
      namespace: openshift-logging
  loki:
    namespace: openshift-operators-redhat
    operator:
      name: loki-operator
      namespace: openshift-operators-redhat
  # ---------------- group-a ----------------
  odf:
    namespace: openshift-storage
    operator:
      name: odf-operator
      namespace: openshift-storage
  acs:
    namespace: rhacs-operator
    operator:
      name: rhacs-operator
      namespace: rhacs-operator
  grafana:
    namespace: grafana-operator
    operator:
      name: grafana-operator
      namespace: grafana-operator
  # ---------------- group-b ----------------
  mongodb:
    namespace: mongodb
    operator:
      name: mongodb-enterprise
      namespace: mongodb
  dynatrace:
    namespace: dynatrace
    operator:
      name: dynatrace-operator
      namespace: dynatrace
  portworx:
    namespace: portworx
    operator:
      name: portworx-certified
      namespace: portworx
  # ---------------- hub clusters ----------------
  # Not in any group: opt a hub in with  component.platform/acm=enabled.
  # Managing the ACM of the hub that runs this GitOps means it upgrades itself -
  # canary on a non-production hub first.
  acm:
    namespace: open-cluster-management
    operator:
      name: advanced-cluster-management
      namespace: open-cluster-management
  # ---------------- migrated from the original trident ApplicationSet ----------------
  # Not in any group: opt a cluster in with  component.platform/trident=enabled
  # (or add "trident" to a group in groups.yaml).
  trident:
    namespace: trident
    repoURL: https://git.example.com/CHANGE-ME/platform-charts.git
    chart: charts/trident
    clusterManifests: true
    helmValues: |
      {{- $platformCatalog := "CHANGE-ME-operator-catalog" }}
      {{- if eq (index .metadata.labels "local-cluster" | default "false") "true" }}
      {{- $platformCatalog = "acm-operator" }}
      {{- end }}
      catalogSource:
        name: {{ $platformCatalog }}
    # Set operator.name / operator.namespace to the Subscription created by the
    # trident chart to get an ACM health policy for it.
