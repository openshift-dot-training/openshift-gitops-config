# =============================================================================
#  Component catalog and repositories - values for the platform-catalog hub
#  chart (openshift-gitops-charts/charts/platform-catalog). WHAT can be
#  installed; groups.yaml decides WHERE; components/, group-values/ and
#  clusters/ hold the values and exact versions.
#  Every field: see that chart's values.yaml. One field is read only by this
#  repository's scripts/validate.sh:
#    versionPolicy: ocp   the operator version follows the OpenShift release:
#                         its versions live in ocp/<x.y>/versions.yaml only,
#                         picked by the cluster's openshiftVersion-major-minor
#                         label (set by ACM) - default: independent
# =============================================================================

repos:
  charts:
    url: https://git.example.com/CHANGE-ME/openshift-gitops-charts.git
    # charts tag for every cluster; a cluster can test another one with the
    # ManagedCluster label chartsRevision=<tag>. Keep bootstrap/root-application.yaml
    # on the same tag (scripts/validate.sh checks it).
    version: v0.2.0
  config:
    url: https://git.example.com/CHANGE-ME/openshift-gitops-config.git
    revision: main

acm:
  # ManagedClusterSets the Placements may select from; bootstrap binds each one
  # to the openshift-gitops and platform-policies namespaces.
  clusterSets:
    - global

# Value layers (later wins). {label:<key>} is any ManagedCluster label,
# including the ones ACM sets; missing files are ignored.
valueFiles:
  - components/versions.yaml
  - components/{component}/values.yaml
  # values by group label (optional layer, for clusters carrying platform/group)
  - group-values/{label:platform/group}/versions.yaml
  - group-values/{label:platform/group}/{component}.yaml
  # operators pinned to the OpenShift release, chosen by the release ACM reports
  - ocp/{label:openshiftVersion-major-minor}/versions.yaml
  - clusters/{cluster}/main-values.yaml
  - clusters/{cluster}/values/{component}.yaml

components:
  # ---------------- common ----------------
  logging:
    namespace: openshift-logging
    operator:
      name: cluster-logging
      namespace: openshift-logging
  loki:
    namespace: openshift-operators-redhat
    operator:
      name: loki-operator
      namespace: openshift-operators-redhat
  # ---------------- group-a ----------------
  odf:
    namespace: openshift-storage
    versionPolicy: ocp
    operator:
      name: odf-operator
      namespace: openshift-storage
  acs:
    namespace: rhacs-operator
    operator:
      name: rhacs-operator
      namespace: rhacs-operator
  grafana:
    namespace: grafana-operator
    operator:
      name: grafana-operator
      namespace: grafana-operator
  # ---------------- group-b ----------------
  mongodb:
    namespace: mongodb
    operator:
      name: mongodb-enterprise
      namespace: mongodb
  dynatrace:
    namespace: dynatrace
    operator:
      name: dynatrace-operator
      namespace: dynatrace
  portworx:
    namespace: portworx
    operator:
      name: portworx-certified
      namespace: portworx
  # ---------------- hub clusters ----------------
  # Not in any group: opt a hub in with  component.platform/acm=enabled.
  # Managing the ACM of the hub that runs this GitOps means it upgrades itself -
  # canary on a non-production hub first.
  acm:
    namespace: open-cluster-management
    operator:
      name: advanced-cluster-management
      namespace: open-cluster-management
  # ---------------- variant examples (opt in per cluster) ----------------
  # OLM dependency in the same InstallPlan: web-terminal requires
  # devworkspace-operator (versions.web-terminal.dependencies).
  web-terminal:
    namespace: web-terminal
    operator:
      name: web-terminal
      namespace: web-terminal

  # Pinned to the OpenShift release, CSV name without "v" (versions.*.csv).
  nmstate:
    namespace: openshift-nmstate
    versionPolicy: ocp
    operator:
      name: kubernetes-nmstate-operator
      namespace: openshift-nmstate
