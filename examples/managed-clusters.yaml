# How clusters match groups. Groups (groups.yaml) are ACM Placement filters:
# some use labels you set (platform/group below, at import time or in your
# cluster-provisioning templates), others only what ACM sets by itself -
# ClusterSet membership, labels such as openshiftVersion-major-minor, vendor,
# cloud, and ClusterClaims such as platform.open-cluster-management.io - which
# need no action here. The ManagedCluster name is also its folder under clusters/.

# cluster-a1: group-a  -> logging, loki, odf, acs, grafana
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: cluster-a1
  labels:
    platform/group: group-a
    # optional pins (default: catalog.yaml repos.charts.version / repos.config.revision)
    # chartsRevision: v0.2.0
    # configRevision: my-branch
---
# cluster-b1: group-b, but WITHOUT portworx and WITH grafana
#   -> logging, loki, mongodb, dynatrace, grafana
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: cluster-b1
  labels:
    platform/group: group-b
    component.platform/portworx: disabled
    component.platform/grafana: enabled
---
# cluster-x1: no group, only the components it opts into
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: cluster-x1
  labels:
    component.platform/web-terminal: enabled
    component.platform/nmstate: enabled
