# Values visible to every component chart on this cluster.
cluster:
  name: cluster-a1
  region: us-east-1

# Operators pinned to the OpenShift release follow the cluster by themselves:
# once ACM reports this cluster on 4.19 (label openshiftVersion-major-minor),
# it reads ocp/4.19/versions.yaml - no override needed here.
#
# Per-cluster version overrides are for independent operators: this cluster is
# the canary for the next Logging z-stream. Everything not listed keeps the
# group / default version.
versions:
  logging:
    channel: stable-6.2
    version: 6.2.13
