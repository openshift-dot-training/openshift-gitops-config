# Component defaults (lowest precedence after the chart).
# Versions (channel, startingCSV, installPlanApproval) are NOT set here: see
# components/versions.yaml, group-values/<group>/versions.yaml and
# clusters/<cluster>/main-values.yaml (versions: block).
operatorGroup:
  targetNamespaces:
    - portworx
subscription:
  name: portworx-certified
  csvFormat: portworx-operator.v%s   # verify the CSV name in your catalog
  source: certified-operators
