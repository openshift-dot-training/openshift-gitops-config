# Let Placements in these namespaces select clusters from the "global" set.
# One binding per set in catalog.yaml acm.clusterSets, in both namespaces
# (scripts/validate.sh checks it).
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: global
  namespace: openshift-gitops
spec:
  clusterSet: global
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: global
  namespace: platform-policies
spec:
  clusterSet: global
